	<head>
		<meta charset="utf-8" />
		<title>FontForgePro</title>
		<meta name="viewport" content="width=device-width" />
		<style>
			html,
			body,
			#app__wrapper,
			#app__landing-page {
				height: 100%;
				width: 100%;
				min-height: 100%;
				min-width: 100%;
				position: absolute;
				top: 0;
				left: 0;
				overflow: hidden;
			}

			body {
				background: #000;
				margin: 0;
				padding: 0;
			}

			#app__wrapper {
				background-color: #000;
			}

			#app__landing-page {
				display: flex;
				align-items: center;
				justify-content: center;
				background: #000;
				color: #fff;
				font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
			}

			#ffpro-boot-cover {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #000;
				color: #fff;
				font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
				transition: opacity .24s ease;
			}

			#ffpro-boot-cover[data-hidden="1"] {
				opacity: 0;
				pointer-events: none;
			}

			.ffpro-boot {
				display: flex;
				align-items: center;
				gap: 18px;
				animation: ffpro-pulse 1.4s ease-in-out infinite alternate;
			}

			.ffpro-boot-mark {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 84px;
				height: 112px;
				border-radius: 22px;
				background: #ebf4f5;
				color: #000;
				font-family: Georgia, 'Times New Roman', serif;
				font-size: 74px;
				font-style: italic;
				font-weight: 700;
				line-height: 1;
				padding-bottom: 8px;
				box-sizing: border-box;
			}

			.ffpro-boot-name {
				font-size: 38px;
				font-weight: 800;
				letter-spacing: -1.2px;
			}

			.ffpro-boot-sub {
				margin-top: 5px;
				color: #999;
				font-size: 10px;
				font-weight: 600;
				letter-spacing: 4px;
			}

			@keyframes ffpro-pulse {
				from { opacity: .72; }
				to { opacity: 1; }
			}

			#errorMessage {
				display: none;
				max-width: 460px;
				padding: 28px;
				border-radius: 28px;
				background: #fff;
				color: #111;
				text-align: left;
				font-size: 14px;
				line-height: 1.7;
			}

			#errorMessage h1 {
				margin: 0 0 10px;
				font-size: 22px;
			}
		</style>
		<script type="module" crossorigin src="/app/assets/index-K6aCMfMi.js"></script>
		<link rel="stylesheet" crossorigin href="/app/assets/index-DLO8eOhr.css" />
	</head>

	<body>
		<div id="ffpro-boot-cover">
			<div class="ffpro-boot">
				<div class="ffpro-boot-mark">f</div>
				<div>
					<div class="ffpro-boot-name">FontForgePro</div>
					<div class="ffpro-boot-sub">字体编辑器</div>
				</div>
			</div>
		</div>

		<div id="app__landing-page">
			<div class="ffpro-boot" id="ffproBoot">
				<div class="ffpro-boot-mark">f</div>
				<div>
					<div class="ffpro-boot-name">FontForgePro</div>
					<div class="ffpro-boot-sub">字体编辑器</div>
				</div>
			</div>

			<div id="errorMessage">
				<h1>FontForgePro 启动失败</h1>
				<div>页面没有正常加载。请关闭 FontForgePro 后重新打开；如果仍然失败，请检查安装文件是否完整。</div>
			</div>
		</div>

		<div id="app__wrapper"></div>

		<script>
			setTimeout(function () {
				const wrapper = document.querySelector('#app__wrapper');
				const boot = document.querySelector('#ffproBoot');
				const error = document.querySelector('#errorMessage');
				if (!wrapper || !wrapper.children.length) {
					if (boot) boot.style.display = 'none';
					if (error) error.style.display = 'block';
				}
			}, 8000);

			setTimeout(function () {
				const cover = document.querySelector('#ffpro-boot-cover');
				if (!cover) return;
				cover.dataset.hidden = '1';
				setTimeout(function () {
					cover.remove();
				}, 260);
			}, 30000);
		</script>
	</body>
</html>
